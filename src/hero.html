<section class="hero hero-mosaic" aria-labelledby="hero-title">
        <div class="mosaic-tile mosaic-social">
          <video
            class="ambient-video"
            data-src="assets/video/home_banner_video_1.mp4" data-src-mobile="assets/video/home_banner_video_1-mobile.mp4"
            poster="assets/posters/hero-main.webp"
            muted
            loop
            playsinline
            preload="none"
            aria-hidden="true"
          ></video>
        </div>
        <div class="mosaic-tile mosaic-latin">
          <video
            class="ambient-video"
            data-src="assets/video/home_banner_video_vert.mp4" data-src-mobile="assets/video/home_banner_video_vert-mobile.mp4"
            poster="assets/posters/hero-side.webp"
            muted
            loop
            playsinline
            preload="none"
            aria-hidden="true"
          ></video>
        </div>
        <div class="mosaic-tile mosaic-brand">
          <img src="assets/home_banner_horizontal.jpg" alt="We Dance Studio" />
        </div>
        <div class="mosaic-tile mosaic-coaching">
          <img
            src="assets/adults.jpg"
            alt="A couple dancing together"
            width="1312"
            height="928"
            fetchpriority="high"
          />
        </div>
        <div class="mosaic-copy">
          <p class="eyebrow">Newtown, PA · Ballroom & Latin</p>
          <h1 id="hero-title">
            Find your rhythm.<br />
            <em>Feel more you.</em>
          </h1>
          <p class="hero-description">
            Your first step. Your first dance. Your next chapter.
          </p>
          <div class="hero-actions">
            <a class="button button-gold" href="#first-lesson"
              >Find your first lesson <svg><use href="#arrow" /></svg></a
            ><a class="text-link light" href="#programs"
              >Explore programs <svg><use href="#arrow" /></svg
            ></a>
          </div>
        </div>
        <span class="hero-seam hero-seam--top" aria-hidden="true"></span>
        <span class="hero-seam hero-seam--bottom" aria-hidden="true"></span>
        <button
          class="motion-toggle"
          data-toggle-motion
          aria-label="Pause background videos"
          aria-pressed="false"
        >
          <span aria-hidden="true">Ⅱ</span>
        </button>
      </section>
